[package]
name = "raven-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Wasm-friendly PIR client surface for Raven: query construction and response extraction across the JS/Wasm boundary."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
raven-inspire = { path = "../inspire" }
serde = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# OsRng only. On wasm32 the browser backend comes from the getrandom `js` feature
# raven-inspire already declares, so this adds no crate to the tree.
rand = { version = "0.8", default-features = false, features = ["getrandom"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# NOT an unconditional dev-dep: proptest pulls rand 0.9 -> rand_core 0.9 -> getrandom 0.3, which
# `compile_error!`s on wasm32-unknown-unknown without the `wasm_js` cfg. ci.yml's
# `clippy -p raven-client --all-targets --target wasm32-unknown-unknown` compiles dev-deps, so an
# unconditional entry here fails that lane outright. The only consumer, tests/panic_safety.rs, is
# native by construction - it drives catch_unwind against the `_rust` mirrors.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
