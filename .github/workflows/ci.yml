name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # nightly production-cell closure lane
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets

  docs:
    name: cargo doc (no deps, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
      # `cargo doc` builds examples; it never RUNS them. Doctests executed in no job,
      # so a `# Errors`/example block could reference an API that no longer compiles
      # and every lane stayed green. Measured 2026-08-11: root 4, adapter 7.
      - name: cargo test --doc (root)
        run: cargo test --workspace --doc
      - name: cargo test --doc (railgun adapter)
        run: |
          cargo test --manifest-path adapters/railgun/Cargo.toml \
            --workspace --doc --profile ci-test

  wasm:
    name: check + clippy (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (wasm32, raven-client)
        run: cargo check -p raven-client --target wasm32-unknown-unknown
      - name: cargo clippy (wasm32, raven-client)
        run: cargo clippy -p raven-client --target wasm32-unknown-unknown -- -D warnings
      - name: cargo fmt (raven-inspire-client-wasm)
        run: cargo fmt --manifest-path adapters/railgun/client-wasm/Cargo.toml -- --check
      - name: cargo check (wasm32, raven-inspire-client-wasm)
        run: cargo check --manifest-path adapters/railgun/client-wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: cargo clippy (wasm32, raven-inspire-client-wasm)
        run: cargo clippy --manifest-path adapters/railgun/client-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

  hygiene:
    name: docs/comment hygiene (no internal-label / no-commit-path leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: check-hygiene
        run: adapters/railgun/scripts/check-hygiene.sh
      - name: adapter hygiene red-proof
        run: adapters/railgun/scripts/check-hygiene-selftest.sh
      - name: check-repo-hygiene
        run: scripts/check-repo-hygiene.sh
      - name: check-layering
        # Two-repo doctrine: no application vocabulary in crates/, and no framework
        # crate depending on an adapter. Nothing enforced this before.
        run: scripts/check-layering.sh
      - name: check-layering red-proof
        run: scripts/check-layering-selftest.sh

  advisories:
    name: cargo-deny full check (every workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny
        run: cargo install cargo-deny --version ^0.19 --locked
      - name: check advisories, licences, bans and sources
        # detached workspaces are invisible to the root graph, so each manifest
        # is gated separately. deny.toml carries the accepted-risk ignores.
        # No trailing subcommand: naming one silently drops the other checks.
        run: |
          set -euo pipefail
          for manifest in \
            Cargo.toml \
            adapters/railgun/Cargo.toml \
            adapters/railgun/client-wasm/Cargo.toml \
            crates/inspire/Cargo.toml \
            crates/isimplepir/Cargo.toml \
            crates/binary-fuse-filter/Cargo.toml \
            examples/eth-state/Cargo.toml \
            benches/b1-bench/Cargo.toml \
            benches/b2-bench/Cargo.toml \
            tools/bench-compare/Cargo.toml
          do
            echo "::group::cargo-deny $manifest"
            cargo deny --manifest-path "$manifest" --all-features check -c deny.toml
            echo "::endgroup::"
          done

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # full history so the pull-request range scan below can resolve
          # base..head; the default shallow clone cannot
          fetch-depth: 0
      - name: install gitleaks
        # pinned by version AND checksum: this job is a supply-chain control,
        # so it must not itself fetch an unverified binary
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: scan working tree
        # catches a secret that is present in the source right now, including
        # submodule contents. --redact keeps any hit out of the public log.
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --no-banner --exit-code 1
      - name: scan commits introduced by this pull request
        if: github.event_name == 'pull_request'
        # blocks a secret that is added and then deleted within the same branch,
        # which the working-tree scan above cannot see. Scoped to the PR range,
        # NOT to full history: pre-existing history is a separate remediation
        # tracked by the owner, and a permanently red job trains reviewers to
        # ignore CI. Do not "fix" this by allowlisting a known-leaked credential.
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  railgun-static:
    name: railgun adapter (fmt + check + clippy)
    runs-on: ubuntu-latest
    # cap so a hung tool surfaces instead of blocking the matrix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "railgun"
      - name: cargo fmt
        run: |
          cargo fmt --manifest-path adapters/railgun/Cargo.toml \
            -p raven-railgun-cli \
            -p raven-railgun-core \
            -p raven-railgun-engine \
            -p raven-railgun-http \
            -p raven-railgun-indexer \
            -p raven-railgun-mock-ppoi \
            -p raven-railgun-persistence \
            -p raven-railgun-poseidon \
            -p raven-railgun-ppoi-mirror \
            -- --check
      - name: cargo check
        run: cargo check --manifest-path adapters/railgun/Cargo.toml --workspace --all-targets
      - name: cargo clippy
        run: cargo clippy --manifest-path adapters/railgun/Cargo.toml --workspace --all-targets -- -D warnings

  railgun-tests:
    # split into three balanced shards (ci-test profile + lld + sccache)
    # to keep the adapter + inspire test build under the time budget
    name: railgun tests (${{ matrix.shard.name }})
    needs: railgun-static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: engine
            packages: "-p raven-railgun-engine"
          - name: cli
            packages: "-p raven-railgun-cli"
          - name: rest
            packages: >-
              -p raven-railgun-http
              -p raven-railgun-indexer
              -p raven-railgun-mock-ppoi
              -p raven-railgun-persistence
              -p raven-railgun-poseidon
              -p raven-railgun-ppoi-mirror
              -p raven-railgun-core
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # re-declare -D warnings since RUSTFLAGS overrides the workflow-level env
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
    steps:
      - name: free disk space
        # adapter target/ tree overruns the runner's default free budget
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: install lld linker
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: install sccache
        # v0.0.10 ships sccache 0.10+ for the GHA cache v2 endpoint
        uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          # shared so shards reuse the first shard's target/ instead of rebuilding inspire cold
          shared-key: "railgun-tests"
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (ci-test profile)
        run: |
          cargo nextest run \
            --manifest-path adapters/railgun/Cargo.toml \
            ${{ matrix.shard.packages }} \
            --all-targets \
            --cargo-profile ci-test \
            --profile ci
      - name: sccache stats
        run: sccache --show-stats
        if: always()

  durability-and-closure:
    # The crash-safety and PIR-closure corpora are `#[ignore]`-gated for local
    # wall time and therefore ran in NO lane at all. Measured on a Zen 5 box:
    # crash-safety 253 s / 16 tests, closure + recovery 113 s / 9 tests, all green.
    # Nothing here is a benchmark; every test asserts byte identity or recovery.
    name: durability + closure (${{ matrix.lane.name }}, --run-ignored all)
    needs: railgun-static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: crash-safety
            packages: "-p raven-railgun-cli"
            cargo_flags: ""
            nextest_profile: ci
            filter: "binary(migrate_encoder_real_sigkill) + binary(migrate_encoder_kill_during) + binary(auto_spawn_races)"
          - name: wal-and-snapshot-chaos
            packages: "-p raven-railgun-persistence"
            # both suites are #![cfg(feature = "chaos-tests")] and compile to
            # empty without it, so the flag is what makes this lane real
            cargo_flags: "--features chaos-tests"
            nextest_profile: ci
            filter: "binary(wal_chaos_layer_b) + binary(snapshot_chaos_save_two_rename)"
          # The 26 assertion-carrying `#[ignore]`d CLI tests ran in NO lane: the three
          # `--run-ignored all` filters above are explicit binary lists that never named
          # these. Measured 2026-08-11 with --no-fail-fast: 26 ignored, 14 green, 12 RED
          # at HEAD (G-032). The twelve are excluded BY NAME, not by dropping their
          # binaries, so a fix flips one line here instead of restoring a whole file.
          # `production_cell_round_trip_and_batch_within_budget` is excluded for a
          # DIFFERENT reason: it is a wall-clock budget (71.9 ms floor), and it measured
          # 402 ms under lane load while passing at 19.9 s standalone. A deadline on a
          # shared runner reds on machine speed, not on code.
          - name: cli-ignored
            packages: "-p raven-railgun-cli"
            cargo_flags: ""
            nextest_profile: ci
            filter: "(binary(auto_spawn_shutdown) + binary(bootstrap_from_subsquid) + binary(multi_list_ppoi_dynamic) + binary(production_cell) + binary(serve_production_config_file) + binary(six_instance_integration) + binary(smart_policy_deferred) + binary(smart_policy_lifecycle)) - (test(tree_fill_threshold_pre_spawns_at_95_percent) + test(boundary_repair_three_seed_per_tree_bench) + test(synthetic_upstream_emits_new_list_key_spawns_two_instances) + test(concurrent_list_observed_bursts_dedupe_to_one_spawn_per_template_per_list_key) + test(restart_replay_picks_up_auto_spawned_ppoi_list_instances_from_spawn_log) + test(manifest_label_mismatch_refuses_boot_per_instance) + test(admin_drain_concurrent_with_auto_spawn_routes_consistently) + test(cooldown_seconds_refuses_back_to_back_spawns) + test(max_count_and_cooldown_compose) + test(max_instance_count_4_refuses_5th_spawn_loud) + test(synthetic_chain_drives_template_based_spawn_to_5_trees) + test(auto_spawned_consumers_drain_wal_on_sigterm) + test(production_cell_round_trip_and_batch_within_budget))"
          - name: engine-ignored
            packages: "-p raven-railgun-engine"
            cargo_flags: ""
            nextest_profile: ci
            filter: "binary(engine_dedup_extends_to_encoder) + binary(offline_packing_keys_cache) + test(insert_rejects_overflow_past_capacity)"
          - name: closure
            packages: "-p raven-railgun-engine"
            cargo_flags: ""
            # production-cell, not ci: multi_instance_recovery_byte_identity
            # measures 113 s on a 16-core box and would trip ci's 120 s x 3 cap
            # on a 4-vCPU runner
            nextest_profile: production-cell
            filter: "binary(t1_status_closure) + binary(t2_path_closure) + binary(t3_commit_tree_path_closure) + binary(phase4_closure) + binary(multi_instance_recovery) + binary(multi_instance_reorg_cascade)"
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: install lld linker
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "railgun-tests"
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (ignored included)
        run: |
          cargo nextest run \
            --manifest-path adapters/railgun/Cargo.toml \
            ${{ matrix.lane.packages }} \
            ${{ matrix.lane.cargo_flags }} \
            --cargo-profile ci-test \
            --profile ${{ matrix.lane.nextest_profile }} \
            --run-ignored all \
            -E '${{ matrix.lane.filter }}'
      - name: sccache stats
        run: sccache --show-stats
        if: always()

  production-cell-closure:
    # nightly + on-demand. Runs the production-parameter (ring_dim 2048) cell-shape
    # closure tests with --run-ignored all. A wrong cell shape does not error, it
    # returns plaintext that decrypts to the wrong bytes, so this lane is the loud
    # failure.
    #
    # The cheap closure tests are NOT ignored and so also run per-commit in the
    # railgun-tests engine shard. What only runs here is the empirical cell-width
    # ladder, which performs ten full production-parameter setups (~150 s) and is
    # the evidence the width law is derived from.
    #
    # The filter is an explicit binary list, not `-p raven-railgun-engine`:
    # --run-ignored all over the whole package would also start the remaining
    # ignored heavy tests, which run for tens of minutes.
    name: production-cell closure (d=2048, --run-ignored all)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # re-declare -D warnings since RUSTFLAGS overrides the workflow-level env
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: install lld linker
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "railgun-tests"
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest (production-cell closure, ignored included)
        run: |
          cargo nextest run \
            --manifest-path adapters/railgun/Cargo.toml \
            -p raven-railgun-engine \
            --cargo-profile ci-test \
            --profile production-cell \
            --run-ignored all \
            -E 'binary(db1_note_record_production_cell) + binary(db2_block_production_cell) + binary(pir_cell_width_law) + binary(per_leaf_path_production_cell) + binary(per_node_production_cell)'
      - name: sccache stats
        run: sccache --show-stats
        if: always()

  isimplepir-tests:
    name: isimplepir (detached workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --manifest-path crates/isimplepir/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path crates/isimplepir/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path crates/isimplepir/Cargo.toml --release
      - name: cargo check (wasm32 client path)
        run: cargo check --manifest-path crates/isimplepir/Cargo.toml --target wasm32-unknown-unknown --no-default-features

  bff-tests:
    name: binary-fuse-filter (detached workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --manifest-path crates/binary-fuse-filter/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path crates/binary-fuse-filter/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path crates/binary-fuse-filter/Cargo.toml --release
      - name: cargo check (wasm32)
        run: cargo check --manifest-path crates/binary-fuse-filter/Cargo.toml --target wasm32-unknown-unknown

  inspire-tests:
    # submodule detached workspace; --release avoids the dev-mode d=2048 timeout.
    # lld + sccache keep the two test runs (default + parallel) under budget.
    name: raven-inspire (submodule workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # re-declare -D warnings since RUSTFLAGS overrides the workflow-level env
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=lld"
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: install lld linker
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "inspire-tests"
      - name: cargo fmt
        run: cargo fmt --manifest-path crates/inspire/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path crates/inspire/Cargo.toml --all-targets -- -D warnings
      - name: cargo test (default)
        run: cargo test --manifest-path crates/inspire/Cargo.toml --release
      - name: cargo test (parallel feature)
        # re-runs the byte-identity KAT under the rayon path so it cannot regress undetected
        run: cargo test --manifest-path crates/inspire/Cargo.toml --release --features parallel
      - name: cargo check (wasm32, client-clean / no rayon)
        run: cargo check --manifest-path crates/inspire/Cargo.toml --target wasm32-unknown-unknown --no-default-features
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  eth-state-example:
    name: eth-state example (detached workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --manifest-path examples/eth-state/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path examples/eth-state/Cargo.toml --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --manifest-path examples/eth-state/Cargo.toml --all-targets
      - name: cargo test (ci-test profile)
        # release-grade profile: the InsPIRe setup this demo drives is slow
        # enough under the dev profile to read as a hang
        run: cargo test --manifest-path examples/eth-state/Cargo.toml --profile ci-test

  b1-bench:
    name: b1-bench (detached workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --manifest-path benches/b1-bench/Cargo.toml -- --check
      - name: cargo clippy
        # the `inspire` feature gates the crate's only binary via
        # required-features, so an unfeatured run compiles nothing
        run: cargo clippy --manifest-path benches/b1-bench/Cargo.toml --features inspire --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --manifest-path benches/b1-bench/Cargo.toml --features inspire --all-targets

  b2-bench:
    name: b2-bench (detached workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --manifest-path benches/b2-bench/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path benches/b2-bench/Cargo.toml --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --manifest-path benches/b2-bench/Cargo.toml --all-targets

  bench-compare:
    name: bench-compare (detached workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --manifest-path tools/bench-compare/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path tools/bench-compare/Cargo.toml --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --manifest-path tools/bench-compare/Cargo.toml --all-targets
      - name: cargo test
        run: cargo test --manifest-path tools/bench-compare/Cargo.toml
      # The gate ships with its red-proof. Phase 1 runs --report-only, so CI never
      # observes the blocking path; without this, the day --report-only is removed is the
      # first time anyone learns whether the gate can fail at all.
      - name: bench gate red-proof
        run: scripts/bench-gate-selftest.sh

  msrv:
    name: MSRV (declared floor actually builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pinned, not `stable`. Every other job floats, so a declared `rust-version` was
      # verified by nothing: the floor could drift below what the code needs and the only
      # signal would be an external contributor's build failing. It has already bitten in the
      # other direction - a floor declared BELOW the real one silently suppresses
      # MSRV-gated clippy lints, and a newer stable then reddens main with lints nobody could
      # see locally.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: assert every declared floor matches the pinned toolchain
        run: |
          set -euo pipefail
          PINNED=1.89
          bad=0
          while IFS= read -r line; do
            file="${line%%:*}"
            ver="$(printf '%s' "$line" | grep -oE '"[0-9]+\.[0-9]+(\.[0-9]+)?"' | tr -d '"')"
            case "$file" in
              # Genuinely lower: its dependency closure is entirely external.
              crates/binary-fuse-filter/Cargo.toml) continue ;;
            esac
            if [ "$ver" != "$PINNED" ]; then
              echo "MSRV DRIFT: $file declares $ver, the pinned toolchain is $PINNED"
              bad=1
            fi
          done < <(git grep -n '^rust-version = ' -- '*/Cargo.toml' 'Cargo.toml')
          [ "$bad" -eq 0 ] || { echo "A declared floor no job builds at is a claim, not a guarantee."; exit 1; }
          echo "every declared rust-version matches the pinned toolchain"
      - name: build at the declared floor
        run: |
          set -euo pipefail
          for m in Cargo.toml adapters/railgun/Cargo.toml benches/b1-bench/Cargo.toml \
                   benches/b2-bench/Cargo.toml crates/isimplepir/Cargo.toml \
                   examples/eth-state/Cargo.toml tools/bench-compare/Cargo.toml; do
            echo "::group::cargo check --manifest-path $m"
            if [ "$m" = "benches/b1-bench/Cargo.toml" ]; then
              cargo check --manifest-path "$m" --features inspire --all-targets
            else
              cargo check --manifest-path "$m" --all-targets
            fi
            echo "::endgroup::"
          done

  bench-gate:
    name: bench regression gate (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Report-only until the runner's own noise floor is measured: the thresholds were
      # derived on a quiet local machine, and a threshold below the runner's noise floor
      # flakes on noise while still missing real shifts. DECISIONS.md B-033 carries the
      # trigger for re-ruling them.
      - name: run bench gate
        run: scripts/bench-gate.sh
      - name: upload bench artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-gate-${{ github.sha }}
          path: target/bench-gate/**/*.json
          if-no-files-found: warn

  sdk-tests:
    # fresh-clone gate: SDK depends on the gitignored wasm-pack output,
    # so this rebuilds it, enforces the bundle ceiling, then runs tests
    name: sdk tests (typescript + wasm-pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: adapters/railgun/sdk/pnpm-lock.yaml
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: build wasm-pack pkg-node + pkg-bundler + size gate
        run: adapters/railgun/scripts/check-wasm-bundle-size.sh
      - name: wasm bundle-size red-proof
        run: adapters/railgun/scripts/check-wasm-bundle-size-selftest.sh
      - name: pnpm install
        run: pnpm install --frozen-lockfile
        working-directory: adapters/railgun/sdk
      - name: pnpm typecheck
        # must run from the SDK directory: a repo-root `tsc` resolves nothing
        # and exits 0, which is why 15 type errors survived here unnoticed
        run: pnpm typecheck
        working-directory: adapters/railgun/sdk
      - name: pnpm test
        run: pnpm test
        working-directory: adapters/railgun/sdk
