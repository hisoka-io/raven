[package]
name = "raven-railgun-ppoi-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Serves a recorded Railgun PPOI list capture over the upstream node's JSON-RPC methods, so tests and local syncs never load the live aggregator."

[lints]
workspace = true

[[bin]]
name = "raven-railgun-ppoi-replay"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
raven-railgun-core = { workspace = true }
raven-railgun-engine = { workspace = true }
raven-railgun-persistence = { workspace = true }
raven-railgun-ppoi-mirror = { workspace = true }
reqwest = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
