[package]
name = "raven-railgun-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Chain-event indexer for the Raven Railgun PIR adapter."

[lints]
workspace = true

[dependencies]
raven-railgun-core = { workspace = true }
raven-railgun-poseidon = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
alloy = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
governor = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
raven-railgun-poseidon = { workspace = true }
axum = { workspace = true }
tempfile = "3"
metrics-util = "0.20"
# Already in the workspace lock at this exact version via alloy-transport-ws, so this adds
# no crate and no licence. Chosen over axum's `ws` feature because axum is a PRODUCTION
# dependency of http/ppoi-mirror/mock-ppoi/cli and feature unification would pull `ws` into
# their graphs. Test-only: it drives a WS server that swaps the chain behind a live socket.
tokio-tungstenite = "0.28"
# Sink/Stream extension traits for driving that WS fixture; already in the lock via alloy.
futures-util = "0.3"
