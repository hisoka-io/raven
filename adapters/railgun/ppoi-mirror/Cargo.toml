[package]
name = "raven-railgun-ppoi-mirror"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Upstream PPOI service mirror for the Raven Railgun PIR adapter: HTTP pull + periodic polling that checks each row's list signature and emits per-list blindedCommitment membership into the engine consumer."

[lints]
workspace = true

[dependencies]
raven-railgun-core = { workspace = true }
raven-railgun-persistence = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
# A signer with a public key, for tests that serve synthetic rows. Verification is not optional.
test-signer = []

[dev-dependencies]
raven-railgun-ppoi-mirror = { path = ".", features = ["test-signer"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
parking_lot = { workspace = true }
