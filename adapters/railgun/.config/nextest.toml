# nextest config for the railgun adapter workspace; does not affect `cargo test`.

[profile.default]
# absorb network/port-bind flake; a real bug fails the retry too
retries = 1
status-level = "pass"
final-status-level = "fail"
failure-output = "immediate"
success-output = "never"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
status-level = "all"
final-status-level = "fail"
failure-output = "final"
success-output = "never"
slow-timeout = { period = "120s", terminate-after = 3 }

# Nightly production-parameter cell-shape closure lane. Identical to `ci` except
# for the timeout budget: the empirical cell-width ladder performs ten full
# ring_dim=2048 PIR setups and measured 147s wall / 430s CPU on a 16-core box,
# so `ci`'s 120s x 3 = 360s termination would kill a healthy run on a 4-vCPU
# runner. Raised here rather than in `ci` so the per-commit budget is unchanged.
[profile.production-cell]
inherits = "ci"
slow-timeout = { period = "300s", terminate-after = 4 }

# One at a time: every test in a target that spawns a cargo-built child and kills it outside
# `impl Drop` (a Drop kill is teardown). Each such kill races a wall clock (a sleep, or a sentinel
# read under a timeout) against the child's progress, and a loaded box moves one against the other.
# The default profile's overrides apply in every profile. `check-ci-filter-names.sh --selected`
# fails when a test of such a target is outside this group.
[test-groups]
chaos-subprocess = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(auto_spawn_races) + binary(migrate_encoder_real_sigkill) + binary(snapshot_chaos_save_two_rename) + binary(wal_chaos_layer_b)"
test-group = "chaos-subprocess"
