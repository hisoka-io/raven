# Example 6-instance mainnet config for
# `raven-railgun serve-production --config <this file>`.
#
# Mirrors the Railgun mainnet topology: 3 static (filled) commit-trees,
# 1 live commit-tree, and 2 PPOI list instances. Adjust the [[instance]]
# blocks to match the current on-chain tree topology.
#
# Cell shape: each [[instance]] takes an optional `entries` (row count) and
# `record_size` (row width). Both default to the instance encoder's canonical
# layout - 131,072 rows for per-node / per-list-node, 65,536 for the leaf-keyed
# encoders - so the four commit-trees and the PPOI path instance below size
# themselves. Setting either to a value the encoder cannot serve is rejected at
# boot; changing either on a populated data_dir needs a re-bootstrap, because
# reconfiguring the shape does not convert existing shards.

[global]
bind = "0.0.0.0:8080"
# Bearer token, from EXACTLY ONE of: `token` (inline), `token_file`, or the
# RAVEN_BEARER_TOKEN environment variable. Zero or two sources is a boot error.
# The literal "REPLACE_ME" is rejected from every source; generate via
# `openssl rand -hex 32`.
#
# Preferred: keep the secret out of this file. A `token_file` and, when `token`
# is inline, this config itself must be mode 600 - anything group- or
# world-reachable refuses to boot and names the file, the mode, and the fix.
#   token_file = "/srv/raven/secrets/bearer-token"
token = "REPLACE_ME"
rpc_url = "https://mainnet.example/eth"
railgun_proxy = "0xfa7093cdd9ee6932b4eb2c9e1cde7ce00b1fa4b9"
chain_id = 1
start_block = 14737691
mirror_endpoint = "https://poi.us.proxy.railwayapi.xyz"
max_concurrent_queries = 4
respond_timeout_secs = 30
record_size = 512
entries_per_shard = 2048
scheme_tag = "raven-inspire-twopacking-inspiring-wp3-cache-session"
use_flock = true
channel_capacity = 1024

# Key per-IP rate limiting off X-Forwarded-For / cf-connecting-ip. Enabling it
# requires naming the peer ranges the proxy connects FROM: a boolean cannot tell
# "behind a proxy" from "directly reachable", and on an exposed origin anyone can
# forge the header and escape the per-IP limit. Every peer outside the list keys
# on its socket address regardless of what it sends.
#   trust_proxy_header = true
#   trusted_proxy_cidrs = ["127.0.0.1/32", "172.16.0.0/12"]
trust_proxy_header = false

# rate_limit_rps = 200      # per-IP refill rate (req/s)
# rate_limit_burst = 400    # per-IP token-bucket capacity

[[instance]]
id = "commit-tree-0"
role = "static"
encoder = "per-node"
tree_number = 0
data_dir = "/var/lib/raven-railgun/commit-tree-0"
verification_mode = "chain-root-history"
data_source = { kind = "indexer", filter = { tree_number = 0 } }

[[instance]]
id = "commit-tree-1"
role = "static"
encoder = "per-node"
tree_number = 1
data_dir = "/var/lib/raven-railgun/commit-tree-1"
verification_mode = "chain-root-history"
data_source = { kind = "indexer", filter = { tree_number = 1 } }

[[instance]]
id = "commit-tree-2"
role = "static"
encoder = "per-node"
tree_number = 2
data_dir = "/var/lib/raven-railgun/commit-tree-2"
verification_mode = "chain-root-history"
data_source = { kind = "indexer", filter = { tree_number = 2 } }

[[instance]]
id = "commit-tree-3"
role = "live"
encoder = "per-node"
tree_number = 3
data_dir = "/var/lib/raven-railgun/commit-tree-3"
verification_mode = "chain-root-history"
data_source = { kind = "indexer", filter = { tree_number = 3 } }

[[instance]]
id = "ppoi-status-ofac"
role = "live"
encoder = "per-list-status"
list_key = "efc6ddb59c098a13fb2b618fdae94c1c3a807abc8fb1837c93620c9143ee9e88"
data_dir = "/var/lib/raven-railgun/ppoi-status-ofac"
verification_mode = "upstream-signature"
data_source = { kind = "mirror", list_key = "efc6ddb59c098a13fb2b618fdae94c1c3a807abc8fb1837c93620c9143ee9e88", what = "status" }

[[instance]]
id = "ppoi-paths-ofac"
role = "live"
encoder = "per-list-node"
list_key = "efc6ddb59c098a13fb2b618fdae94c1c3a807abc8fb1837c93620c9143ee9e88"
data_dir = "/var/lib/raven-railgun/ppoi-paths-ofac"
verification_mode = "upstream-signature"
data_source = { kind = "mirror", list_key = "efc6ddb59c098a13fb2b618fdae94c1c3a807abc8fb1837c93620c9143ee9e88", what = "path" }
